<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ROBOMLM — Discovery</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">R</div>
        <div class="brand-text">
          <div class="brand-name">ROBOMLM</div>
          <div class="brand-tag">Intelligence OS</div>
        </div>
      </div>
      <nav class="nav">
        <div class="nav-label">Workspace</div>
        <a class="nav-item" href="/terminal"><span class="nav-icon">⌂</span> Terminal</a>
        <a class="nav-item active" href="/discovery"><span class="nav-icon">⌕</span> Discovery</a>
        <a class="nav-item" href="/memory"><span class="nav-icon">◈</span> Memory</a>
        <a class="nav-item" href="/research"><span class="nav-icon">⌘</span> Research</a>
        <a class="nav-item" href="/automation"><span class="nav-icon">⚙</span> Automation</a>
        <a class="nav-item" href="/account"><span class="nav-icon">◎</span> Account</a>
      </nav>
      <div class="sidebar-footer">
        <span class="status-dot"></span>
        <span>v0.1 · Presentation Layer</span>
      </div>
    </aside>

    <main class="main">
      <div class="page-header">
        <div class="page-header-left">
          <div class="page-title"><span class="title-icon">⌕</span> Opportunity Discovery</div>
          <div class="page-sub">Universal scanner · Crypto · Equity · Index · Forex · Commodity</div>
        </div>
      </div>

      <div class="tabs" id="market-tabs"></div>

      <div class="filter-bar">
        <div class="filter-group">
          <label>Signal</label>
          <select id="f-signal">
            <option value="">All</option>
            <option value="BUY">BUY</option>
            <option value="SELL">SELL</option>
            <option value="HOLD">HOLD</option>
          </select>
        </div>
        <div class="filter-group">
          <label>Min EQE</label>
          <select id="f-eqe">
            <option value="0">0</option>
            <option value="70">70</option>
            <option value="80">80</option>
            <option value="85">85</option>
          </select>
        </div>
        <div class="filter-group">
          <label>Risk</label>
          <select id="f-risk">
            <option value="">All</option>
            <option value="LOW">LOW</option>
            <option value="MED">MED</option>
            <option value="HIGH">HIGH</option>
          </select>
        </div>
        <div class="filter-stat" id="f-count">—</div>
      </div>

      <div class="card">
        <div class="card-title"><span class="ct-icon">🎯</span> Scan Results</div>
        <table class="data-table">
                    <thead>
            <tr>
              <th>Symbol</th>
              <th>Market</th>
              <th>Change</th>
              <th>Signal</th>
              <th>EQE</th>
              <th>Engines</th>
              <th>R:R</th>
              <th>Risk</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="results-body"></tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="/static/js/discovery.js"></script>
</body>
</html>
