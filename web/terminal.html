<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ROBOMLM — Terminal</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
  <div class="layout">

    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">R</div>
        <div class="brand-text">
          <div class="brand-name">ROBOMLM</div>
          <div class="brand-tag">Intelligence OS</div>
        </div>
      </div>
      <nav class="nav">
        <div class="nav-label">Workspace</div>
        <a class="nav-item active" href="/terminal"><span class="nav-icon">⌂</span> Terminal</a>
        <a class="nav-item" href="/discovery"><span class="nav-icon">⌕</span> Scanner</a>
        <a class="nav-item" href="/buyer"><span class="nav-icon">🛒</span> Buyer</a>
        <a class="nav-item" href="/memory"><span class="nav-icon">◈</span> Memory</a>
        <a class="nav-item" href="/research"><span class="nav-icon">⌘</span> Research</a>
        <a class="nav-item" href="/automation"><span class="nav-icon">⚙</span> Automation</a>
        <a class="nav-item" href="/account"><span class="nav-icon">◎</span> Account</a>
      </nav>
      <div class="sidebar-footer">
        <span class="status-dot"></span>
        <span>v0.1 · Presentation Layer</span>
      </div>
    </aside>

    <main class="main main-tight">

      <!-- ============ SYMBOL BAR ============ -->
      <div class="symbol-bar">
        <div class="symbol-left">
          <select id="market-select" class="symbol-select">
            <option value="Crypto">🟡 Crypto</option>
            <option value="Index">🟠 Indian Index</option>
            <option value="Equity">🟢 Indian Equity</option>
            <option value="Forex">🔵 Forex</option>
            <option value="Commodity">🟣 Commodity</option>
          </select>
          <select id="symbol-select" class="symbol-select">
            <option value="BTC/USDT">BTC/USDT</option>
            <option value="ETH/USDT">ETH/USDT</option>
            <option value="SOL/USDT">SOL/USDT</option>
            <option value="NIFTY50">NIFTY50</option>
            <option value="BANKNIFTY">BANKNIFTY</option>
            <option value="EURUSD">EURUSD</option>
            <option value="GOLD">GOLD</option>
          </select>
          <div class="symbol-price">
            <span id="sb-price">$67,432.50</span>
            <span id="sb-change" class="symbol-change text-green">▲ +1.24%</span>
          </div>
        </div>

        <div class="symbol-right">
          <div class="tf-group" id="tf-group">
            <button class="tf-btn active" data-tf="1m">1m</button>
            <button class="tf-btn" data-tf="5m">5m</button>
            <button class="tf-btn" data-tf="15m">15m</button>
            <button class="tf-btn" data-tf="1H">1H</button>
            <button class="tf-btn" data-tf="4H">4H</button>
          </div>
          <div id="state-badge" class="state-badge state-waiting">● WAITING</div>
        </div>
      </div>

      <!-- ============ CHART ============ -->
      <div class="chart-card">
        <div id="chart" class="chart-container"></div>
      </div>

      <!-- ============ METRICS STRIP ============ -->
      <div class="strip-card">
        <div class="strip-label">📊 METRICS</div>
        <div class="strip-items" id="metrics-strip"></div>
      </div>

      <!-- ============ EVIDENCE STRIP ============ -->
      <div class="strip-card">
        <div class="strip-label">🔍 EVIDENCE</div>
        <div class="strip-items" id="evidence-strip"></div>
      </div>

      <!-- ============ BOTTOM ROW ============ -->
      <div class="bottom-grid">

        <div class="decision-box" id="decision-box">
          <div class="decision-header">
            <span class="decision-title">🎯 D13 SIGNAL</span>
            <span class="decision-count" id="decision-count">7/10</span>
          </div>

          <div class="d13-signal-box" id="d13-signal-box">
            <div class="d13-signal-text" id="d13-signal-text">—</div>
            <div class="d13-signal-meta">
              <span>Conf: <b id="d13-conf">—</b></span>
              <span>Grade: <b id="d13-grade">—</b></span>
              <span>RR: <b id="d13-rr">—</b></span>
            </div>
          </div>

          <div class="manual-inputs">
            <div class="manual-input-row">
              <label>TP (optional)</label>
              <input type="number" step="0.0001" id="in-tp" placeholder="e.g. 68970" />
            </div>
            <div class="manual-input-row">
              <label>SL (optional)</label>
              <input type="number" step="0.0001" id="in-sl" placeholder="e.g. 65980" />
            </div>
          </div>

          <div class="trade-buttons">
            <button class="trade-btn call" id="btn-call" disabled>
              <span class="arrow">▲</span> CALL
            </button>
            <button class="trade-btn put" id="btn-put" disabled>
              <span class="arrow">▼</span> PUT
            </button>
          </div>

          <button class="btn btn-block" id="btn-confirm" disabled style="margin-top:8px">
            ✓ Confirm Trade
          </button>

          <div class="decision-reason" id="decision-reason"></div>

          <div class="decision-progress">
            <div class="decision-progress-bar" id="decision-progress-bar"></div>
          </div>
        </div>

        <div class="mini-card">
          <div class="mini-card-title">🛡 CAS Gates</div>
          <div class="mini-card-body" id="p-cas"></div>
        </div>

        <div class="mini-card">
          <div class="mini-card-title">📡 Live Log</div>
          <div class="mini-card-body scrollable" id="p-log"></div>
        </div>

      </div>

    </main>
  </div>

  <script src="/static/js/terminal.js?v=2"></script>
</body>
</html>
